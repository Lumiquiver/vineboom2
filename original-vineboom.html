<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>VineBoom</title>
<style>
*{box-sizing:border-box;margin:0;user-select:none;-webkit-user-select:none;touch-action:none}
body{background:#111;color:#fff;font:600 14px system-ui,sans-serif;overflow:hidden}canvas{display:block}
.p{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a120cb0;z-index:5}
.card{background:#1d241e;border:3px solid #5cb85c;padding:16px;max-width:440px;width:94%;max-height:96vh;overflow:auto;touch-action:pan-y}
h1{font:900 36px monospace;color:#7CFC00;text-shadow:3px 3px #000;text-align:center}
input,select,button{font:inherit;padding:8px;margin:3px 0;width:100%;background:#2b352c;color:#fff;border:2px solid #4a5}
button{background:#3a9a3a;cursor:pointer;border-color:#7d7}button:active{transform:scale(.97)}
.r{display:flex;gap:6px;align-items:center}.r>*{flex:1}small{opacity:.7}
#hud>*{position:fixed;pointer-events:none;text-shadow:1px 1px #000}
#cross{left:50%;top:50%;transform:translate(-50%,-50%);font:700 26px monospace}
#hp{left:12px;bottom:12px;font-size:20px}#am{right:12px;bottom:12px;font-size:20px;text-align:right}
#feed{right:10px;top:10px;text-align:right}#pus{left:10px;top:10px}#hm{left:50%;top:50%;transform:translate(-50%,-50%);color:#f33;font-size:30px;opacity:0}
#dmg{inset:0;box-shadow:inset 0 0 120px 40px #f00;opacity:0}#msg{left:50%;top:30%;transform:translateX(-50%);font-size:28px}
#sb{left:50%;top:50%;transform:translate(-50%,-50%);background:#000b;padding:12px;min-width:260px;display:none}
#tc{display:none;position:fixed;inset:0;z-index:3}#tc b{position:fixed;width:58px;height:58px;border-radius:50%;background:#fff3;border:2px solid #fff8;display:flex;align-items:center;justify-content:center}
</style></head><body>
<div id="hud"><div id="cross">+</div><div id="hp"></div><div id="am"></div><div id="feed"></div><div id="pus"></div><div id="hm">✖</div><div id="dmg"></div><div id="msg"></div><div id="sb"></div></div>
<div id="tc"><b data-b="f" style="right:20px;bottom:90px;width:76px;height:76px">🔫</b><b data-b="j" style="right:110px;bottom:40px">⤒</b><b data-b="r" style="right:100px;bottom:130px">↻</b><b data-b="n" style="right:20px;bottom:185px">⇄</b><b data-b="t" style="right:20px;top:60px">☰</b></div>
<div class="p" id="menu"><div class="card"><h1>VINEBOOM</h1><small id="st"></small>
<input id="nm" maxlength="14" placeholder="Username">
<div class="r"><input id="col" type="color"><select id="hat"><option value="0">No hat</option><option value="1">Crown</option><option value="2">Top hat</option><option value="3">Party cone</option><option value="4">Halo</option></select></div>
<div class="r"><canvas id="pv" width="8" height="8" style="width:48px;height:48px;image-rendering:pixelated;flex:none"></canvas><input type="file" id="sf" accept="image/png"><input id="su" placeholder="MC username"><button id="sl" style="flex:none;width:60px">Load</button></div>
<small>Skin: upload a 64x64 Minecraft skin PNG, or type a Java username.</small>
<div class="r"><span>Sens</span><input id="se" type="range" min=".3" max="3" step=".1"><span>Vol</span><input id="vo" type="range" min="0" max="1" step=".05"></div>
<select id="mp"></select>
<button id="solo">▶ Solo Practice</button><button id="cr">🏠 Create Lobby (host)</button>
<div class="r"><input id="jc" placeholder="Lobby code" maxlength="4"><button id="jn">Join</button></div>
<div id="lob" style="display:none;border-top:2px solid #4a5;margin-top:8px;padding-top:8px">Lobby code: <b id="lc" style="font-size:22px;color:#7CFC00"></b><div id="pl"></div><button id="go">🚀 Start match</button></div>
<small>WASD move · Mouse aim · Click fire · R reload · 1-9/Q/E/wheel weapons · Tab scores · Shift sprint</small></div></div>
<div class="p" id="lk" style="display:none;cursor:pointer"><div class="card" style="text-align:center">Click to resume<br><button id="lv" style="margin-top:10px">Leave match</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const T=THREE,$=i=>document.getElementById(i),mob='ontouchstart'in window;
let S={name:'Player'+(Math.random()*99|0),col:'#3a7bd5',hat:0,sens:1,vol:.5,skin:'',...JSON.parse(localStorage.vb||'{}')};S.st={k:0,d:0,g:0,xp:0,bs:0,...S.st};
const save=()=>localStorage.vb=JSON.stringify(S),hs=(x,z)=>{const n=Math.sin(x*12.9898+z*78.233)*43758.5453;return n-Math.floor(n)};
const WP=`Pistol,18,300,12,1100,.012,1,0,70,#999
Revolver,48,650,6,1700,.004,1,0,80,#cc8
SMG,11,75,30,1400,.045,1,1,60,#6cf
Assault Rifle,16,105,30,1800,.022,1,1,90,#7a7
Shotgun,10,800,6,2200,.09,8,0,40,#c85
Sniper,95,1300,5,2500,0,1,0,150,#456
LMG,14,90,80,3500,.05,1,1,90,#a66
Minigun,8,40,150,4500,.075,1,1,80,#fa3
Laser Rifle,12,65,40,2000,.01,1,1,100,#f3f
Crossbow,65,900,1,1200,0,1,0,100,#b95
Burst Rifle,20,420,24,1700,.015,3,0,90,#3cb
Knife,28,380,0,0,0,1,0,2.6,#ddd
Sword,42,600,0,0,0,1,0,3.2,#6df
Axe,58,820,0,0,0,1,0,3,#a54
Bat,36,500,0,0,0,1,0,3,#db8
Hammer,75,1100,0,0,0,1,0,3.2,#888`.split('\n').map(l=>{const a=l.split(',');return{n:a[0],d:+a[1],r:+a[2],m:+a[3],rl:+a[4],sp:+a[5],pl:+a[6],au:+a[7],rg:+a[8],c:a[9]}});
const M=[
{n:'Greenfield',sky:0x87ceeb,t:'#5cb85c',s:'#8b5a2b',f:(x,z)=>3+Math.round(2*Math.sin(x/5)+2*Math.cos(z/6))+(hs(x>>2,z>>2)>.9?3:0)},
{n:'Dune Sea',sky:0xf4d58d,t:'#e8d28a',s:'#d2b36a',f:(x,z)=>3+Math.round(3*Math.sin((x+z)/5)+Math.sin(x/3))},
{n:'Frostpeak',sky:0xcfe8ff,t:'#f4fbff',s:'#9ec9e6',f:(x,z)=>2+Math.round(4*Math.max(0,Math.sin(x/6)*Math.cos(z/6)))+(hs(x>>1,z>>1)>.93?3:0)},
{n:'Nether Keep',sky:0x3a0a0a,t:'#9a3b2b',s:'#4a1a1a',f:(x,z)=>2+(Math.sin(x/4)*Math.sin(z/4)>.2?3:0)+(hs(x>>1,z>>1)>.9?4:0)},
{n:'End Isles',sky:0x120a22,v:1,t:'#e6e6a8',s:'#8a7fb0',f:(x,z)=>Math.hypot(x-20,z-20)>17?0:3+Math.round(Math.sin(x/3)*Math.cos(z/3))+(hs(x>>2,z>>2)>.88?4:0)},
{n:'Candy City',sky:0xffc2e0,t:'#ff8fc8',s:'#8fe3ff',f:(x,z)=>2+((x>>2)+(z>>2))%3*2}];
const PU=[['Speed','#0ff'],['Double Dmg','#f80'],['Regen','#0f0'],['Shield','#48f'],['Rapid Fire','#ff0'],['High Jump','#f0f']];
M.forEach((m,i)=>$('mp').add(new Option('Map: '+m.n,i)));
$('nm').value=S.name;$('col').value=S.col;$('hat').value=S.hat;$('se').value=S.sens;$('vo').value=S.vol;
['nm','col','hat','se','vo'].forEach(i=>$(i).oninput=()=>{S.name=$('nm').value||'Player';S.col=$('col').value;S.hat=+$('hat').value;S.sens=+$('se').value;S.vol=+$('vo').value;save();prev()});
function stats(){$('st').textContent=`K ${S.st.k} · D ${S.st.d} · K/D ${(S.st.k/Math.max(1,S.st.d)).toFixed(2)} · Matches ${S.st.g} · Best streak ${S.st.bs} · Level ${1+(S.st.xp/100|0)}`}
// skin
function defSkin(c){const k=document.createElement('canvas');k.width=k.height=64;const x=k.getContext('2d');x.fillStyle=c;x.fillRect(0,0,64,64);x.fillStyle='#c68863';x.fillRect(0,0,32,16);x.fillStyle='#222';x.fillRect(10,11,2,2);x.fillRect(14,11,2,2);return k}
function skinCanvas(url,cb){const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{const k=document.createElement('canvas');k.width=k.height=64;k.getContext('2d').drawImage(im,0,0);cb(k)};im.onerror=()=>cb(null);im.src=url}
function prev(){const c=$('pv').getContext('2d');c.clearRect(0,0,8,8);if(S.skin)skinCanvas(S.skin,k=>k&&c.drawImage(k,8,8,8,8,0,0,8,8));else c.drawImage(defSkin(S.col),8,8,8,8,0,0,8,8)}
function setSkin(url){skinCanvas(url,k=>{if(!k)return alert('Could not load skin (CORS/network). Try uploading the PNG instead.');S.skin=k.toDataURL();save();prev()})}
$('sf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>setSkin(r.result);r.readAsDataURL(f)};
$('sl').onclick=()=>$('su').value&&setSkin('https://minotar.net/skin/'+encodeURIComponent($('su').value));
// audio
let AC;const snd=(f,d,ty='square',v=.2,f2)=>{try{AC=AC||new AudioContext;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v*S.vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start();o.stop(t+d)}catch(e){}};
const boom=()=>{snd(110,.9,'sine',1.4,28);snd(70,.6,'sawtooth',.4,20)};
// three
const R=new T.WebGLRenderer({antialias:true}),scene=new T.Scene,cam=new T.PerspectiveCamera(75,1,.05,200),vm=new T.Group;
document.body.prepend(R.domElement);scene.add(cam,new T.AmbientLight(0xffffff,.75));const dl=new T.DirectionalLight(0xffffff,.7);dl.position.set(10,30,5);scene.add(dl);cam.add(vm);
const rs=()=>{R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()};onresize=rs;rs();
const N=40;let H=[],mapI=0,mesh,pk=[],fx=[];const pg=new T.Group;scene.add(pg);
const hAt=(x,z)=>{const i=Math.floor(x),j=Math.floor(z);if(i<0||j<0||i>=N||j>=N)return-99;return H[i][j]>0?H[i][j]:-99};
function build(i){mapI=i;const m=M[i];scene.background=new T.Color(m.sky);scene.fog=new T.Fog(m.sky,25,75);if(mesh)scene.remove(mesh);H=[];let c=0;
for(let x=0;x<N;x++){H[x]=[];for(let z=0;z<N;z++){H[x][z]=Math.max(m.v?0:1,m.f(x,z)|0);c+=Math.min(3,H[x][z])}}
mesh=new T.InstancedMesh(new T.BoxGeometry(1,1,1),new T.MeshLambertMaterial(),c);const d=new T.Object3D,col=new T.Color;let k=0;
for(let x=0;x<N;x++)for(let z=0;z<N;z++){const h=H[x][z];for(let y=Math.max(0,h-3);y<h;y++){d.position.set(x+.5,y+.5,z+.5);d.updateMatrix();mesh.setMatrixAt(k,d.matrix);col.set(y==h-1?m.t:m.s).multiplyScalar(.85+hs(x*7+y,z)*.3);mesh.setColorAt(k++,col)}}
scene.add(mesh);pg.clear();pk=[];
for(let i=0;i<6;i++){let x,z,t=0;do{x=3+hs(i+1,mapI+t)*(N-6);z=3+hs(mapI+2,i+t)*(N-6);t++}while(hAt(x,z)<1&&t<50);
const b=new T.Mesh(new T.BoxGeometry(.5,.5,.5),new T.MeshBasicMaterial({color:PU[i][1]}));b.position.set(x,hAt(x,z)+1,z);pg.add(b);pk.push({m:b,t:0,i})}}
// game state
let pl={},me={},myid='me',peer,conns=[],hostConn,host=0,started=0,roster={},playing=0,dead=0,cur=3,ammo=[],rl=0,nf=0,hp=100,sh=0,pu={},streak=0,swing=0,px=20,py=5,pz=20,vy=0,onG=0,yaw=0,pit=0,jx=0,jy=0,fire_=0,lastS=0,lastT=0;
const k={},myInfo=()=>({t:'j',id:myid,name:S.name,col:S.col,hat:S.hat,skin:S.skin});
const initMe=()=>{pl[myid]=me={id:myid,name:S.name,k:0,d:0}};
// player model
const sc=1.8/32;
function part(w,h,d,u,v,tex,top){const g=new T.BoxGeometry(w*sc,h*sc,d*sc);g.translate(0,(top?-1:1)*h*sc/2,0);
[[u+d+w,v+d,d,h],[u,v+d,d,h],[u+d,v,w,d],[u+d+w,v,w,d],[u+d,v+d,w,h],[u+2*d+w,v+d,w,h]].forEach((r,i)=>{[[r[0],r[1]],[r[0]+r[2],r[1]],[r[0],r[1]+r[3]],[r[0]+r[2],r[1]+r[3]]].forEach((p,j)=>g.attributes.uv.setXY(i*4+j,p[0]/64,1-p[1]/64))});
return new T.Mesh(g,new T.MeshLambertMaterial({map:tex,transparent:true,alphaTest:.5}))}
function mkPlayer(o){const g=new T.Group,tx=new T.CanvasTexture(defSkin(o.col));tx.magFilter=T.NearestFilter;
const set=c=>{tx.image=c;tx.needsUpdate=true};if(o.skin)skinCanvas(o.skin,c=>c&&set(c));
const old=!1,P={head:part(8,8,8,0,0,tx,0),body:part(8,12,4,16,16,tx,1),ra:part(4,12,4,40,16,tx,1),la:part(4,12,4,32,48,tx,1),rl:part(4,12,4,0,16,tx,1),ll:part(4,12,4,16,48,tx,1)};
P.head.position.y=24*sc;P.body.position.y=24*sc;P.ra.position.set(-6*sc,24*sc,0);P.la.position.set(6*sc,24*sc,0);P.rl.position.set(-2*sc,12*sc,0);P.ll.position.set(2*sc,12*sc,0);
Object.values(P).forEach(m=>g.add(m));
const hm=(w,h,d,c,y)=>{const m=new T.Mesh(new T.BoxGeometry(w*sc,h*sc,d*sc),new T.MeshLambertMaterial({color:c}));m.position.y=y*sc;P.head.add(m)};
if(o.hat==1){hm(9,3,9,'#fc0',8+1.5)}if(o.hat==2){hm(10,1.5,10,'#111',8.5);hm(6,7,6,'#111',12)}
if(o.hat==3){const c=new T.Mesh(new T.ConeGeometry(.2,.45,8),new T.MeshLambertMaterial({color:'#f6a'}));c.position.y=8*sc+.22;P.head.add(c)}
if(o.hat==4){const c=new T.Mesh(new T.TorusGeometry(.22,.03,6,16),new T.MeshBasicMaterial({color:'#ff6'}));c.rotation.x=Math.PI/2;c.position.y=8*sc+.2;P.head.add(c)}
const cv=document.createElement('canvas');cv.width=256;cv.height=48;const x=cv.getContext('2d');x.font='bold 30px sans-serif';x.textAlign='center';x.fillStyle='#fff';x.strokeStyle='#000';x.lineWidth=5;x.strokeText(o.name,128,34);x.fillText(o.name,128,34);
const sp=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(cv),depthTest:false}));sp.scale.set(1.6,.3,1);sp.position.y=2.3;g.add(sp);g.P=P;scene.add(g);return g}
function addPl(o){if(o.id==myid||(pl[o.id]&&pl[o.id].o))return;const g=mkPlayer(o);pl[o.id]={...o,k:0,d:0,o:g,tp:new T.Vector3(0,-50,0),yaw:0,pit:0,ph:0};g.position.set(0,-50,0);lobbyUI()}
function drop(id){if(pl[id]){pl[id].o&&scene.remove(pl[id].o);delete pl[id];lobbyUI()}}
function lobbyUI(){$('pl').innerHTML=Object.values(pl).map(p=>'• '+p.name).join('<br>')}
// network
function send(o){if(host)conns.forEach(c=>c.open&&c.send(o));else if(hostConn&&hostConn.open)hostConn.send(o)}
function handle(o){const n=performance.now();switch(o.t){
case'j':addPl(o);break;
case'w':build(o.map);o.roster.forEach(addPl);if(o.go)start();break;
case'go':start();break;
case'l':drop(o.id);break;
case's':{const p=pl[o.id];if(p&&p.o){p.tp.set(o.p[0],o.p[1],o.p[2]);p.yaw=o.y;p.pit=o.r;p.o.visible=!o.x;p.w=o.w}break}
case'f':tracer(new T.Vector3(...o.o),new T.Vector3(...o.e),o.c);snd(180,.08,'sawtooth',.12,60);break;
case'h':if(o.to==myid)takeDmg(o.dmg,o.from);break;
case'k':{const v=pl[o.id],b=pl[o.by];if(o.id!=myid&&v)v.d++;if(b&&o.by!=o.id){if(o.by==myid){b.k++;S.st.k++;S.st.xp+=10;if(++streak>S.st.bs)S.st.bs=streak;boom();save();stats()}else b.k++}
const f=document.createElement('div');f.textContent=(b?b.name:'World')+' ➜ '+(v?v.name:'?');$('feed').prepend(f);setTimeout(()=>f.remove(),5000);break}
case'pu':{const q=pk[o.i];if(q){q.t=n+20000;q.m.visible=false;if(o.id==myid)applyPU(q.i)}break}}}
function hostRoom(){host=1;const code=Math.random().toString(36).slice(2,6).toUpperCase();peer=new Peer('vboom-'+code);
peer.on('open',id=>{myid=id;initMe();roster[id]=myInfo();build(+$('mp').value);$('lc').textContent=code;$('lob').style.display='block';$('go').style.display='block';lobbyUI();$('pl').innerHTML=me.name+' (you)'});
peer.on('error',e=>alert('Network: '+e.type));
peer.on('connection',c=>{conns.push(c);c.on('open',()=>c.send({t:'w',map:mapI,go:started,roster:Object.values(roster)}));
c.on('data',o=>{if(o.t=='j'){roster[o.id]=o;c.pid=o.id}handle(o);conns.forEach(x=>x!==c&&x.open&&x.send(o))});
c.on('close',()=>{conns=conns.filter(x=>x!==c);if(c.pid){delete roster[c.pid];drop(c.pid);send({t:'l',id:c.pid})}})})}
function joinRoom(code){peer=new Peer();peer.on('error',e=>alert('Network: '+e.type+' (check code)'));
peer.on('open',id=>{myid=id;initMe();hostConn=peer.connect('vboom-'+code.toUpperCase().trim(),{reliable:true});
hostConn.on('open',()=>{$('lc').textContent=code.toUpperCase();$('lob').style.display='block';$('go').style.display='none';hostConn.send(myInfo())});
hostConn.on('data',handle);hostConn.on('close',()=>{alert('Host left the lobby');location.reload()})})}
$('cr').onclick=hostRoom;$('jn').onclick=()=>$('jc').value&&joinRoom($('jc').value);
$('go').onclick=()=>{send({t:'go'});start()};
$('solo').onclick=()=>{initMe();build(+$('mp').value);start()};
// match
function start(){if(playing)return;started=1;playing=1;S.st.g++;save();$('menu').style.display='none';if(mob)$('tc').style.display='block';else R.domElement.requestPointerLock();ammo=WP.map(w=>w.m);vmake();spawn()}
function spawn(){for(let i=0;i<99;i++){const x=2+Math.random()*(N-4),z=2+Math.random()*(N-4);if(hAt(x,z)>0){px=x;pz=z;py=hAt(x,z)+.01;break}}hp=100;sh=0;pu={};dead=0;vy=0;rl=0;ammo=WP.map(w=>w.m);$('msg').textContent=''}
function takeDmg(d,from){if(dead||!playing)return;if(sh>0){const a=Math.min(sh,d);sh-=a;d-=a}hp-=d;$('dmg').style.opacity=1;snd(120,.15,'sawtooth',.3,50);if(hp<=0)die(from)}
function die(by){if(dead)return;dead=1;streak=0;me.d++;S.st.d++;save();stats();const o={t:'k',id:myid,by};send(o);handle(o);$('msg').textContent='💀 Respawning...';setTimeout(spawn,3000)}
function applyPU(i){const n=performance.now();snd(600,.3,'sine',.3,1200);const m=['sp','db','rg','sd','ra','hj'][i];if(m=='sd')sh=50;else pu[m]=n+12000;$('msg').textContent=PU[i][0]+'!';setTimeout(()=>!dead&&($('msg').textContent=''),1200)}
// weapons
function vmake(){vm.clear();const w=WP[cur],mt=new T.MeshLambertMaterial({color:w.c});vm.position.set(.3,-.28,-.55);
if(w.m){const b=new T.Mesh(new T.BoxGeometry(.09,.12,.5+Math.min(.4,w.d/250)),mt);const h=new T.Mesh(new T.BoxGeometry(.07,.16,.08),mt);h.position.set(0,-.12,.15);vm.add(b,h)}
else{const b=new T.Mesh(new T.BoxGeometry(.06,.6,.06),mt);b.position.set(0,.2,0);vm.add(b);vm.rotation.x=.2}}
function sw(i){cur=(i+WP.length)%WP.length;rl=0;vm.rotation.set(0,0,0);vmake()}
function reload(){const w=WP[cur];if(!w.m||rl||ammo[cur]>=w.m)return;rl=performance.now()+w.rl;snd(300,.15,'square',.15,500)}
function tracer(a,b,c){const l=new T.Line(new T.BufferGeometry().setFromPoints([a,b]),new T.LineBasicMaterial({color:c,transparent:true}));scene.add(l);fx.push({m:l,l:.1,tr:1})}
function debris(x,y,z){const c=new T.Color(M[mapI].t);for(let i=0;i<4;i++){const m=new T.Mesh(new T.BoxGeometry(.12,.12,.12),new T.MeshBasicMaterial({color:c}));m.position.set(x,y,z);scene.add(m);fx.push({m,l:.8,v:new T.Vector3((Math.random()-.5)*4,Math.random()*4,(Math.random()-.5)*4)})}}
function ray(o,d,rg){for(let t=0;t<rg;t+=.25){const x=o.x+d.x*t,y=o.y+d.y*t,z=o.z+d.z*t;if(y<hAt(x,z)){debris(x,y,z);return{t}}
for(const id in pl){const p=pl[id];if(id==myid||!p.o||!p.o.visible)continue;const q=p.o.position;if(Math.hypot(x-q.x,z-q.z)<.45&&y>q.y&&y<q.y+1.85)return{t,id,head:y>q.y+1.4}}}return{t:rg}}
function fire(){const w=WP[cur],n=performance.now();if(dead||n<nf||rl)return;if(w.m&&ammo[cur]<=0)return reload();
nf=n+w.r/(pu.ra>n?2:1);if(w.m){ammo[cur]--;vm.position.z+=.08;pit+=.006;snd(150+Math.random()*80,.09,'sawtooth',.25,50)}else{swing=1;snd(400,.12,'triangle',.2,150)}
const o=cam.getWorldPosition(new T.Vector3()),acc={};
for(let i=0;i<w.pl;i++){const d=new T.Vector3(0,0,-1).applyQuaternion(cam.quaternion);d.x+=(Math.random()-.5)*w.sp*2;d.y+=(Math.random()-.5)*w.sp*2;d.z+=(Math.random()-.5)*w.sp*2;d.normalize();
const r=ray(o,d,w.rg),e=o.clone().addScaledVector(d,r.t);
if(w.m){const s=o.clone().addScaledVector(d,.6);s.y-=.15;tracer(s,e,w.c);send({t:'f',o:[s.x,s.y,s.z],e:[e.x,e.y,e.z],c:w.c})}
if(r.id)acc[r.id]=(acc[r.id]||0)+w.d*(pu.db>n?2:1)*(r.head?1.5:1)}
for(const id in acc){send({t:'h',to:id,from:myid,dmg:acc[id]});if(id==myid)continue;$('hm').style.opacity=1;snd(900,.06,'sine',.3)}}
// input
addEventListener('keydown',e=>{k[e.code]=1;if(!playing)return;const m=e.code.match(/^Digit(\d)$/);if(m)sw((+m[1]||10)-1);if(e.code=='KeyQ')sw(cur-1);if(e.code=='KeyE')sw(cur+1);if(e.code=='KeyR')reload();if(e.code=='Tab'){e.preventDefault();$('sb').style.display='block'}});
addEventListener('keyup',e=>{k[e.code]=0;if(e.code=='Tab')$('sb').style.display='none'});
addEventListener('wheel',e=>playing&&sw(cur+(e.deltaY>0?1:-1)));
addEventListener('mousedown',e=>{if(playing&&document.pointerLockElement)fire_=1});addEventListener('mouseup',()=>fire_=0);
addEventListener('mousemove',e=>{if(document.pointerLockElement){yaw-=e.movementX*.0022*S.sens;pit=Math.max(-1.5,Math.min(1.5,pit-e.movementY*.0022*S.sens))}});
document.addEventListener('pointerlockchange',()=>{$('lk').style.display=playing&&!mob&&!document.pointerLockElement?'flex':'none'});
$('lk').onclick=e=>{if(e.target.id=='lk')R.domElement.requestPointerLock()};$('lv').onclick=()=>location.reload();
let tj,tl,jo,lo;
addEventListener('touchstart',e=>{if(!playing)return;for(const t of e.changedTouches){const b=t.target.closest&&t.target.closest('[data-b]');if(b){const c=b.dataset.b;if(c=='f')fire_=1;if(c=='j'&&onG)vy=pu.hj>performance.now()?11:8;if(c=='r')reload();if(c=='n')sw(cur+1);if(c=='t')$('sb').style.display=$('sb').style.display=='block'?'none':'block'}
else if(t.clientX<innerWidth/2){tj=t.identifier;jo=[t.clientX,t.clientY]}else{tl=t.identifier;lo=[t.clientX,t.clientY]}}},{passive:true});
addEventListener('touchmove',e=>{for(const t of e.changedTouches){if(t.identifier==tj){jx=Math.max(-1,Math.min(1,(t.clientX-jo[0])/50));jy=Math.max(-1,Math.min(1,(jo[1]-t.clientY)/50))}if(t.identifier==tl){yaw-=(t.clientX-lo[0])*.006*S.sens;pit=Math.max(-1.5,Math.min(1.5,pit-(t.clientY-lo[1])*.006*S.sens));lo=[t.clientX,t.clientY]}}},{passive:true});
addEventListener('touchend',e=>{for(const t of e.changedTouches){if(t.identifier==tj){tj=null;jx=jy=0}if(t.identifier==tl)tl=null}fire_=0},{passive:true});
// loop
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.05,(ts-lastT)/1000||0),n=performance.now();lastT=ts;
if(!playing){cam.position.set(20+Math.cos(ts/4000)*30,16,20+Math.sin(ts/4000)*30);cam.lookAt(20,3,20);if(!mesh)build(0)}
else{if(!dead){const sp=(k.ShiftLeft?7:5)*(pu.sp>n?1.5:1);let f=(k.KeyW?1:0)-(k.KeyS?1:0)+jy,s=(k.KeyD?1:0)-(k.KeyA?1:0)+jx;const l=Math.hypot(f,s);if(l>1){f/=l;s/=l}
const vx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*sp,vz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*sp,cl=v=>Math.max(.4,Math.min(N-.4,v));
let nx=cl(px+vx*dt);if(hAt(nx,pz)<=py+.55)px=nx;let nz=cl(pz+vz*dt);if(hAt(px,nz)<=py+.55)pz=nz;
if(k.Space&&onG)vy=pu.hj>n?11:8;vy-=22*dt;py+=vy*dt;const g=hAt(px,pz);if(py<=g){py=g;vy=0;onG=1}else onG=0;if(py<-12)die(null);
if(pu.rg>n)hp=Math.min(100,hp+4*dt);
if(fire_&&(WP[cur].au||nf<n-1))fire(),WP[cur].au||(fire_=0);
if(rl&&n>rl){rl=0;ammo[cur]=WP[cur].m}
pk.forEach(q=>{if(!q.m.visible&&n>q.t)q.m.visible=true;q.m.rotation.y+=dt*2;if(q.m.visible&&Math.hypot(px-q.m.position.x,pz-q.m.position.z)<1.1&&Math.abs(py+.8-q.m.position.y)<2){const o={t:'pu',i:q.i,id:myid};send(o);handle(o)}});
if(n-lastS>66){lastS=n;send({t:'s',id:myid,p:[px,py,pz],y:yaw+Math.PI,r:pit,x:dead?1:0,w:cur})}}
cam.position.set(px,py+1.6,pz);cam.rotation.set(pit,yaw,0,'YXZ');
vm.position.z+=(-.55-vm.position.z)*Math.min(1,dt*12);if(swing>0){swing=Math.max(0,swing-dt*4);vm.rotation.x=.2-Math.sin(swing*Math.PI)*1.6}
for(const id in pl){const p=pl[id];if(id==myid||!p.o)continue;const q=p.o.position,mv=q.distanceTo(p.tp);q.lerp(p.tp,.3);p.o.rotation.y=p.yaw;p.ph+=mv*6;const a=mv>.01?Math.sin(p.ph)*.7:0,P=p.o.P;P.ra.rotation.x=a;P.la.rotation.x=-a;P.rl.rotation.x=-a;P.ll.rotation.x=a;P.head.rotation.x=-p.pit*.6}
$('hp').innerHTML=`❤ ${Math.ceil(hp)}${sh>0?` 🛡 ${Math.ceil(sh)}`:''}<br><small>K ${me.k||0} · D ${me.d||0}</small>`;
const w=WP[cur];$('am').innerHTML=`${w.n}<br>${w.m?(rl?'Reloading…':ammo[cur]+' / '+w.m):'Melee'} <small>[${cur+1}/${WP.length}]</small>`;
$('pus').innerHTML=Object.entries({sp:0,db:1,rg:2,ra:4,hj:5}).filter(([c])=>pu[c]>n).map(([c,i])=>`<div style="color:${PU[i][1]}">${PU[i][0]} ${((pu[c]-n)/1000|0)}s</div>`).join('');
$('dmg').style.opacity=Math.max(0,$('dmg').style.opacity-dt*1.5);$('hm').style.opacity=Math.max(0,$('hm').style.opacity-dt*5);
$('sb').innerHTML='<b>SCOREBOARD</b><table style="width:100%">'+Object.values(pl).sort((a,b)=>b.k-a.k).map(p=>`<tr><td>${p.name}</td><td>${p.k}</td><td>${p.d}</td><td>${(p.k/Math.max(1,p.d)).toFixed(1)}</td></tr>`).join('')+'</table><small>name · kills · deaths · K/D</small>'}
for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.l-=dt;if(f.tr)f.m.material.opacity=f.l/.1;else{f.v.y-=12*dt;f.m.position.addScaledVector(f.v,dt)}if(f.l<=0){scene.remove(f.m);fx.splice(i,1)}}
R.render(scene,cam)}
stats();prev();requestAnimationFrame(loop);
</script></body></html>
